  const forms = [
    `<div class="field"><label for="btopic">Topik contoh</label><select id="btopic" name="topic">${options(['Studi dan pekerjaan','Relasi','Keseharian'],draft.topic)}</select></div>`,
    `<div class="cols"><div class="field"><label for="bpro">Psikolog fiktif</label><select id="bpro" name="psychologist">${options(['Psikolog Demo A','Psikolog Demo B'],draft.psychologist)}</select></div><div class="field"><label for="bmethod">Metode</label><select id="bmethod" name="method">${options(service==='Offline'?['Tatap muka · lokasi contoh']:service==='Instan'?['Chat']:['Chat','Panggilan video'],draft.method)}</select></div><div class="field"><label for="bduration">Durasi (menit)</label><select id="bduration" name="duration">${options(['30','45','60'],draft.duration)}</select></div><div class="field"><label for="bcount">Jumlah sesi</label><select id="bcount" name="count">${options(['1','2','3'],draft.count)}</select></div></div>`,
    `<div class="note" style="margin-bottom:14px">${safe(draft.topic)} · ${safe(draft.psychologist)} · ${safe(draft.method)} · ${safe(draft.count)} sesi</div><div class="cols"><div class="field"><label for="bdate">Tanggal contoh</label><input type="date" id="bdate" name="date" min="${today()}" value="${safe(draft.date||today())}" required></div><div class="field"><label for="btime">Slot contoh</label><select id="btime" name="time">${options(['09:00','11:00','14:00','16:00'],draft.time)}</select></div></div><label class="check"><input type="checkbox" required> Saya memilih pembayaran simulasi Rp0.</label>`
  ];
  showDialog(`<span class="eyebrow">LANGKAH ${wizard} DARI 3 · ${service.toUpperCase()}</span><h2 id="dialog-title">${['Pilih topik','Atur layanan','Konfirmasi jadwal'][wizard-1]}</h2><form id="booking-form">${forms[wizard-1]}<div class="actions">${wizard>1?'<button type="button" class="btn alt" data-action="book-back">Kembali</button>':''}<button class="btn" type="submit">${wizard===3?'Simpan simulasi':'Lanjut'}</button></div></form>`);
  $('#booking-form').onsubmit = event => {
    event.preventDefault();
    Object.assign(draft,Object.fromEntries(new FormData(event.target)));
    if (wizard < 3) { wizard++; booking(); return; }
    const ref = 'DEMO-' + String(state.bookings.length+1).padStart(3,'0');
    if (save(next=>next.bookings.push({...draft,ref,service}))) {
      $('#modal').close(); render(); notify('Jadwal simulasi tersimpan · '+ref);
    }
  };
}
function journal() {
  const week = new Date();
  week.setDate(week.getDate()-6);
  const entries = state.journal.filter(e=>journalFilter==='Semua'||journalFilter==='Hari ini'&&e.day===today()||journalFilter==='7 hari'&&e.day>=localDate(week)||journalFilter==='Favorit'&&e.favorite);
  return title('CATATAN PRIBADI','Journal','Tulis apa yang kamu rasakan atau pilih satu pertanyaan untuk memulai.')+`<div class="grid"><section class="card"><div class="title-row"><h2>Riwayat journal</h2><button class="btn" data-action="write">+ Tulis jurnal</button></div><div class="chips">${['Semua','Hari ini','7 hari','Favorit'].map(f=>`<button class="chip ${journalFilter===f?'active':''}" data-journal-filter="${f}" aria-pressed="${journalFilter===f}">${f}</button>`).join('')}</div>${entries.length?entries.map(e=>`<article class="journal-entry"><small>${dateLabel(e.day)} · ${safe(e.topic)}</small><h3>${safe(e.title)}</h3><p>${safe(e.body)}</p><div class="actions"><button class="btn alt" data-favorite="${e.id}" aria-pressed="${e.favorite}">${e.favorite?'★ Favorit':'☆ Favorit'}</button><button class="btn alt" data-edit="${e.id}">Edit</button><button class="btn danger" data-remove="${e.id}">Hapus</button></div></article>`).join(''):'<div class="empty">Belum ada jurnal pada tampilan ini.</div>'}</section><aside><section class="card"><h2 style="margin-bottom:12px">Topik journal</h2><div class="list">${Object.keys(topics).slice(0,3).map((topic,i)=>item(['🌱','💬','☀'][i],topic,topics[topic],`data-topic="${safe(topic)}"`)).join('')}</div></section></aside></div>`;
}
function write(topic='Jurnal bebas',existing=null) {
  showDialog(`<span class="eyebrow">${safe(topic)}</span><h2 id="dialog-title">${existing?'Edit jurnal':'Tulis jurnal'}</h2><p style="margin-bottom:13px">${topics[topic]}</p><form id="journal-form"><div class="field"><label for="jtitle">Judul</label><input id="jtitle" name="title" maxlength="90" required value="${safe(existing?.title)}"></div><div class="field"><label for="jbody">Isi jurnal</label><textarea id="jbody" name="body" maxlength="3000" required>${safe(existing?.body)}</textarea></div><div class="note">Gunakan catatan fiktif untuk demonstrasi tugas.</div><div class="actions"><button class="btn" type="submit">Simpan jurnal</button></div></form>`);
  $('#journal-form').onsubmit = event => {
    event.preventDefault();
    const form = new FormData(event.target), title = form.get('title').trim(), body = form.get('body').trim();
    if (!title || !body) { notify('Isi judul dan catatan terlebih dahulu.'); return; }
    const entry = {...existing, title, body, topic, id:existing?.id || Date.now().toString(36), day:existing?.day || today(), favorite:existing?.favorite || false};
    if (save(next=>{ if (existing) next.journal = next.journal.map(e=>e.id===existing.id?entry:e); else next.journal.unshift(entry); })) {
      $('#modal').close(); journalFilter='Semua'; render(); notify('Jurnal tersimpan.');
    }
  };
}
function journey() {
  return title('REFLEKSI BERTAHAP','Journey','Selesaikan satu bagian sebelum melanjutkan ke bagian berikutnya.')+`<div class="grid">${journeys.map(j=>{const done=(state.journey[j.id]||[]).length;return `<section class="card"><div class="title-row"><div class="tile" aria-hidden="true">${j.emoji}</div><span class="pill">${done} / ${j.prompts.length} bagian</span></div><h2>${j.name}</h2>${meter(done,j.prompts.length,'Progres journey')}${j.prompts.map((prompt,i)=>`<div class="step"><b>${i<done?'✓':i+1}</b><div><h3>Bagian ${i+1}</h3><p>${i>done?'Selesaikan bagian sebelumnya.':prompt}</p>${i<=done?`<button class="btn alt" style="margin-top:6px" data-reflect="${j.id}:${i}">${i<done?'Lihat refleksi':'Mulai refleksi'}</button>`:''}</div></div>`).join('')}</section>`;}).join('')}</div>`;
}
function reflect(id, i) {
  const j = journeys.find(x=>x.id===id), notes=state.journey[id]||[];
  if (!j || i>notes.length || i>=j.prompts.length) return;
  showDialog(`<span class="eyebrow">BAGIAN ${i+1}</span><h2 id="dialog-title">${j.name}</h2><p style="margin-bottom:13px">${j.prompts[i]}</p><form id="reflect-form"><div class="field"><label for="reflection">Catatan refleksi contoh</label><textarea id="reflection" name="reflection" maxlength="1500" required>${safe(notes[i])}</textarea></div><div class="actions"><button class="btn" type="submit">${i<notes.length?'Simpan perubahan':'Selesaikan bagian'}</button></div></form>`);
  $('#reflect-form').onsubmit = event => {
    event.preventDefault();
    const answer = new FormData(event.target).get('reflection').trim();
    if (!answer) { notify('Isi catatan refleksi terlebih dahulu.'); return; }
    if (save(next=>{ next.journey[id] ||= []; next.journey[id][i]=answer; })) {
      $('#modal').close(); render(); notify('Refleksi tersimpan.');
    }
  };
}
let sound;
function stopSound() {
  if (!sound) return;
  sound.close().catch(()=>{});
  sound = undefined;
}
async function startSound() {
  try {
    sound = new AudioContext();
    const ctx = sound, gain = ctx.createGain();
    gain.gain.value = .025;
    gain.connect(ctx.destination);
    [146.83,220,293.66].forEach((hz,i)=>{
      const tone = ctx.createOscillator(), vol=ctx.createGain();
      tone.frequency.value = hz;
      vol.gain.value = .32/(i+1);
      tone.connect(vol).connect(gain);
      tone.start();
    });
    await ctx.resume();
  } catch { stopSound(); notify('Nada ambient tidak tersedia di browser ini.'); }
  render();
}
function pauseSession() {
  const m = meditations.find(x=>x.id===state.session?.id);
  if (!m || !state.session.started) return true;
  const played = elapsed(m);
  return save(next=>{next.progress[m.id]=played; next.session={id:m.id,seconds:played,started:null};});
}
function render() {
  $('#nav').innerHTML = tabs.map(([id,label,path])=>`<button class="${page===id?'active':''}" data-page="${id}" ${page===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>${label}</button>`).join('');
  $('#app').innerHTML = ({home,med,counsel,journal,journey})[page]();
  if (storageIssue) $('#app').insertAdjacentHTML('afterbegin','<div class="note warm">Penyimpanan browser tidak dapat dibaca. Tampilan bisa dijelajahi. Buka dengan Chrome atau Edge biasa untuk mencoba menyimpan.</div>');
  if ($('#reminder-form')) $('#reminder-form').onsubmit = event => {
    event.preventDefault();
    const time = new FormData(event.target).get('reminder');
    if (save(next=>{next.reminder=time;})) { reminderShown=''; render(); notify('Pengingat disetel pukul '+time+'.'); }
  };
}
$('#close').onclick = () => $('#modal').close();
document.addEventListener('click',event=>{
  const d = event.target.closest('button')?.dataset;
  if (!d) return;
  if (d.page) {
    if (page==='med' && d.page!=='med') { if (!pauseSession()) return; stopSound(); }
    navigate(d.page);
  }
  if (d.mood!==undefined && save(next=>{next.moods[today()]=Number(d.mood);})) {render();notify('Suasana hati tersimpan.');}
  if (d.medFilter) { medFilter=d.medFilter; render(); }
  if (d.journalFilter) { journalFilter=d.journalFilter; render(); }
  if (d.service) { service=d.service; render(); }
  if (d.session) {
    const m=meditations.find(x=>x.id===d.session);
    if (m && state.session?.id!==m.id) {
      if (!pauseSession()) return;
      stopSound();
      if (!save(next=>{next.session={id:m.id,seconds:next.progress[m.id]||0,started:null};})) return;
    }
    navigate('med');
    $('.session')?.scrollIntoView({block:'nearest'});
  }
  if (d.action==='toggle-session') {
    const m=meditations.find(x=>x.id===state.session?.id);
    if (!m) return;
    if (state.session.started) {pauseSession();stopSound();}
    else save(next=>{const played=elapsed(m);next.session={id:m.id,seconds:played===m.seconds?0:played,started:Date.now()};next.progress[m.id]=next.session.seconds;});
    render();
  }
  if (d.action==='ambient') { if (sound) {stopSound();render();} else startSound(); }
  if (d.action==='clear-reminder' && save(next=>{next.reminder='';})) render();
  if (d.action==='instant') { service='Instan'; navigate('counsel'); wizard=1; draft={}; booking(); }
  if (d.action==='book') { wizard=1; draft={}; booking(); }
  if (d.action==='book-back') { Object.assign(draft,Object.fromEntries(new FormData($('#booking-form')))); wizard--; booking(); }
  if (d.action==='write') write();
  if (d.topic) write(d.topic);
  if (d.edit) {const entry=state.journal.find(e=>e.id===d.edit); if(entry) write(entry.topic,entry);}
  if (d.favorite && save(next=>{const e=next.journal.find(x=>x.id===d.favorite);if(e)e.favorite=!e.favorite;})) render();
  if (d.remove) showDialog(`<h2 id="dialog-title">Hapus jurnal ini?</h2><p>Catatan akan dihapus dari riwayat di browser ini.</p><div class="actions"><button class="btn danger" data-confirm-remove="${safe(d.remove)}">Hapus jurnal</button></div>`);
  if (d.confirmRemove && save(next=>{next.journal=next.journal.filter(e=>e.id!==d.confirmRemove);})) {$('#modal').close();render();notify('Jurnal dihapus.');}
  if (d.reflect) {const [id,index]=d.reflect.split(':'); reflect(id,Number(index));}
});
setInterval(()=>{
  const m = meditations.find(x=>x.id===state.session?.id), timer = $('#timer');
  if (m && timer && state.session.started) {
    const n=elapsed(m);
    timer.textContent=minutes(n)+' / '+minutes(m.seconds);
    $('.session progress').value=n;
    $('#med-prompt').textContent=m.prompts[Math.min(2,Math.floor(n/m.seconds*3))];
    if (n===m.seconds && pauseSession()) {stopSound();render();notify('Sesi meditasi selesai.');}
  }
  const date=new Date(), time=date.toTimeString().slice(0,5), marker=today()+time;
  if (state.reminder===time && reminderShown!==marker) {
    reminderShown=marker; notify('Pengingat meditasi · waktunya mengambil jeda.');
  }
},1000);
render();
</script>
</body>
